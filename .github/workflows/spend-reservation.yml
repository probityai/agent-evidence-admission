name: Pre-call spend reservation and signed local effects
on:
  push:
    branches: [main]
    paths: ['consumers/spend-reservation/**', '.github/workflows/spend-reservation.yml']
  pull_request:
    paths: ['consumers/spend-reservation/**', '.github/workflows/spend-reservation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atomic-budget-and-observed-effects:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_DATE_EPOCH: '946684800'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: probityai/agent-evidence-observer
          ref: 7eb18757745b4ac869131d9d319b9ccd7287edf1
          path: observer-selected
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install pinned tools and exact selected packages
        run: |
          set -euo pipefail
          profile="$GITHUB_WORKSPACE/consumers/spend-reservation"
          mkdir -p "$RUNNER_TEMP/spend-evidence"
          exec > >(tee "$RUNNER_TEMP/spend-evidence/installation.log") 2>&1
          python -m venv "$RUNNER_TEMP/spend-env"
          "$RUNNER_TEMP/spend-env/bin/python" -m pip install --no-compile --require-hashes -r "$profile/build.lock" -r "$profile/requirements.lock"
          "$RUNNER_TEMP/spend-env/bin/python" -m pip wheel --no-build-isolation --no-deps "$profile" "$GITHUB_WORKSPACE/observer-selected" --wheel-dir "$RUNNER_TEMP/spend-evidence/wheels"
          "$RUNNER_TEMP/spend-env/bin/python" -m pip install --no-index --no-deps --no-compile "$RUNNER_TEMP/spend-evidence/wheels/agent_evidence_observer-0.0.1-py3-none-any.whl" "$RUNNER_TEMP/spend-evidence/wheels/probity_spend_reservation-0.0.1-py3-none-any.whl"
      - name: Exercise concurrent processes and refusal controls
        run: |
          set -euo pipefail
          SPEND_RESULTS="$RUNNER_TEMP/spend-evidence/controls" "$RUNNER_TEMP/spend-env/bin/python" -I -B consumers/spend-reservation/test_reservation.py -v 2>&1 | tee "$RUNNER_TEMP/spend-evidence/controls.log"
      - name: Bind local effects to prior budget reservations
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/spend-env/bin/python" -I -B consumers/spend-reservation/qualify.py --observer-checkout observer-selected --output "$RUNNER_TEMP/spend-evidence/native" > "$RUNNER_TEMP/spend-evidence/native.stdout" 2> "$RUNNER_TEMP/spend-evidence/native.stderr"
      - name: Retain original source, selections, wheels and decisions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spend-reservation-originals-${{ github.sha }}
          path: ${{ runner.temp }}/spend-evidence
          if-no-files-found: error
          retention-days: 90
